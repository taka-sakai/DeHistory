<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title data-i18n="options_pageTitle"></title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <h1 data-i18n="options_pageTitle"></h1>
    <div class="save-row">
        <button id="save" data-i18n="options_saveBtn"></button>
        <div id="status" class="status"></div>
    </div>

    <div class="form-group">
        <div><strong data-i18n="options_autoRunTiming"></strong></div>
        <div><input type="checkbox" id="runOnStartup"> <label for="runOnStartup" class="inline" data-i18n="options_runOnStartup"></label></div>
        <div>
            <input type="checkbox" id="runOnClose">
            <label for="runOnClose" class="inline" data-i18n="options_runOnClose"></label>
            <div class="tooltip">
                <span class="help-icon warning-icon" id="helpIconClose">⚠</span>
                <div class="tooltip-content" id="tooltipContentClose">
                    <span class="close-btn" id="closeTooltipClose">×</span>
                    <span data-i18n="options_runOnCloseTooltipLine1"></span><br>
                    <span data-i18n="options_runOnCloseTooltipLine2"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="form-group">
        <div><strong data-i18n="options_deleteTargetsCommon"></strong></div>
        <div><input type="checkbox" id="removeHistory" checked> <label for="removeHistory" class="inline" data-i18n="options_removeHistory"></label>
        </div>
        <div><input type="checkbox" id="removeCookies" checked> <label for="removeCookies" class="inline" data-i18n="options_removeCookies"></label>
        </div>
        <div><input type="checkbox" id="removeCacheAndStorage" checked> <label for="removeCacheAndStorage"
                class="inline" data-i18n="options_removeCacheAndStorage"></label></div>
        <div><input type="checkbox" id="removeDownloads" checked> <label for="removeDownloads"
                class="inline" data-i18n="options_removeDownloads"></label></div>
        <div><input type="checkbox" id="removeFormData" checked> <label for="removeFormData"
                class="inline" data-i18n="options_removeFormData"></label></div>
    </div>

    <div class="allowlist-header">
        <label data-i18n="options_allowlistLabel"></label>
        <div class="tooltip">
            <span class="help-icon" id="helpIcon">?</span>
            <div class="tooltip-content" id="tooltipContent">
                <span class="close-btn" id="closeTooltip">×</span>
                <span data-i18n="options_allowlistDesc"></span><br>
                <span data-i18n="options_allowlistNote"></span><br>
                <br>
                <strong data-i18n="options_allowlistFormatTitle"></strong><br>
                <span class="indented" data-i18n="options_allowlistFormatIntro"></span>
                <span class="indented-2"><strong data-i18n="options_allowlistFormat1Title"></strong>: <code data-i18n="options_allowlistFormat1Code"></code></span>
                <span class="indented-3" data-i18n="options_allowlistFlag1"></span>
                <span class="indented-3" data-i18n="options_allowlistFlag0"></span>
                <span class="indented-2"><strong data-i18n="options_allowlistFormat2Title"></strong>: <code data-i18n="options_allowlistFormat2Code"></code></span>
                <span class="indented-3" data-i18n="options_allowlistFormat2Note"></span>
                <strong data-i18n="options_allowlistExampleTitle"></strong><br>
                <span class="indented-2"><code>example.com,1,1</code> <span data-i18n="options_allowlistExample1"></span></span>
                <span class="indented-2"><code>example.org,1,0</code> <span data-i18n="options_allowlistExample2"></span></span>
                <span class="indented-2"><code>example.net</code> <span data-i18n="options_allowlistExample3"></span></span>
            </div>
        </div>
    </div>
    <div id="errorList" class="error-list">
        <span class="close-btn" id="closeErrorList">×</span>
        <strong data-i18n="options_errorListTitle"></strong>
        <ul id="errorItems"></ul>
    </div>
    <div class="form-group">
        <textarea id="allowlist" data-i18n-placeholder="options_allowlistPlaceholder"></textarea>
    </div>

    <script type="module" src="options.js"></script>
</body>

</html>
